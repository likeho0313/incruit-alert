name: Job Alert Bot

on:
  schedule:
    # 5분마다 한 번씩 실행 (GitHub Actions 표준 cron 형식)
    - cron: '*/5 * * * *'
  # 필요할 때 수동으로 바로 실행할 수 있는 버튼
  workflow_dispatch:

permissions:
  # 스크립트가 last_jobs.json 및 last_posts.json 파일을 업데이트하고 저장소에 푸시할 수 있도록 쓰기 권한 부여
  contents: write

jobs:
  build:
    # 최신 runner 환경 (Ubuntu 26 / 24 지원)
    runs-on: ubuntu-latest

    steps:
      # 1. 코드 가져오기 (Node 24 호환 actions/checkout@v4 최신 버전)
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10' # 사용하는 파이썬 버전

      # 2. 파이썬 설치 (Ubuntu 26.04 지원 Python 3.12 LTS + actions/setup-python@v5)
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip' # 패키지 다운로드 캐싱으로 실행 시간 단축

      # 3. 라이브러리 설치 (requests 및 beautifulsoup4 포함)
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. 원티드 채용 공고 봇 실행
      - name: Run Wanted Job Bot
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python job_bot.py

      # 5. 유맨 게시판 알림 봇 실행
      - name: Run Uman Bot
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python uman_bot.py
        
      # 6. 변경된 last_jobs.json & last_posts.json 파일을 다시 저장소에 커밋 및 푸시
      - name: Commit and push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          # 파일이 없을 경우 대비 빈 파일 생성 방지 및 변경사항 스테이징
          git add last_jobs.json last_posts.json || true
          git commit -m "chore(bot): update last seen job IDs and forum posts [skip ci]" || echo "No changes to commit"
          git push
